name: Build BSEB Study Engine APK (Free Cloud Builder)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests (Scoring, Timer, Selection, Backup)
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Installable Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Installable APK Artifact (Download on Vivo T4R)
        uses: actions/upload-artifact@v4
        with:
          name: BSEB-AI-Study-Engine-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
